name: Auto Publish TrailLog Carousel

on:
  schedule:
    # 매일 오전 9시 KST (UTC 00:00) 자동 실행
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      brd:
        description: "여행 구분 (걷기 / 자전거)"
        required: true
        default: "걷기"
        type: choice
        options:
          - 걷기
          - 자전거
      keyword:
        description: "코스명 검색 키워드 (선택, 비우면 미게시 코스 자동 선택)"
        required: false
        default: ""
        type: string
      style:
        description: "디자인 스타일"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - forest
          - ocean
      dry_run:
        description: "사전 검증만 수행 (실제 인스타그램 게시 안 함)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  publish-carousel:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 필수 Repository Secrets 확인
        env:
          DURUNUBI_API_KEY: ${{ secrets.DURUNUBI_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          missing=""
          [ -z "$DURUNUBI_API_KEY" ] && missing="$missing DURUNUBI_API_KEY"
          [ -z "$IG_USER_ID" ] && missing="$missing IG_USER_ID"
          [ -z "$IG_ACCESS_TOKEN" ] && missing="$missing IG_ACCESS_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::GitHub Repository Secrets에 다음 필수 항목을 등록해 주세요:$missing"
            exit 1
          fi

      - name: 한글 폰트 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-nanum

      - name: Python 3.12 설정 및 패키지 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 카드뉴스 생성 및 인스타그램 자동 게시
        env:
          DURUNUBI_API_KEY: ${{ secrets.DURUNUBI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_VERSION: v24.0
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_MEDIA_BRANCH: media-assets
        run: |
          ARGS=(--brd "${{ inputs.brd || '걷기' }}" --style "${{ inputs.style || 'auto' }}" --skip-published --count 1)
          if [ -n "${{ inputs.keyword }}" ]; then
            ARGS+=(--keyword "${{ inputs.keyword }}")
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run-publish)
          else
            ARGS+=(--publish)
          fi
          python main.py "${ARGS[@]}"

      - name: 게시 이력(published_history.json) 자동 커밋
        if: ${{ inputs.dry_run != true }}
        run: |
          if ! git diff --quiet published_history.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add published_history.json
            git commit -m "chore: update published_history.json [skip ci]"
            git push
          fi
