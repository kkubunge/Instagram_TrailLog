name: Auto Publish TrailLog Carousel

on:
  workflow_dispatch:
    inputs:
      brd:
        description: "여행 구분 (걷기 / 자전거)"
        required: true
        default: "걷기"
        type: choice
        options:
          - 걷기
          - 자전거
      keyword:
        description: "코스명 검색 키워드 (선택, 비우면 미게시 코스 노선 순환 선택)"
        required: false
        default: ""
        type: string
      style:
        description: "디자인 스타일"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - forest
          - ocean
      dry_run:
        description: "사전 검증만 수행 (실제 인스타그램 게시 안 함)"
        required: false
        default: false
        type: boolean
      slack_channel_id:
        description: "결과 보고를 보낼 Slack 채널 또는 DM ID"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: traillog-publish
  cancel-in-progress: false

jobs:
  publish-carousel:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 필수 Repository Secrets 확인
        env:
          DURUNUBI_API_KEY: ${{ secrets.DURUNUBI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          missing=""
          [ -z "$DURUNUBI_API_KEY" ] && missing="$missing DURUNUBI_API_KEY"
          [ -z "$IG_USER_ID" ] && missing="$missing IG_USER_ID"
          [ -z "$IG_ACCESS_TOKEN" ] && missing="$missing IG_ACCESS_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::GitHub Repository Secrets에 다음 필수 항목을 등록해 주세요:$missing"
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY가 등록되지 않아 규칙 기반 캡션 폴백으로 동작합니다."
          fi

      - name: Pretendard 한글 폰트 캐시
        id: cache-pretendard
        uses: actions/cache@v4
        with:
          path: fonts
          key: pretendard-v1.3.9-ttf

      - name: Pretendard 한글 폰트 설치 (폴백 Nanum 포함)
        if: steps.cache-pretendard.outputs.cache-hit != 'true'
        run: |
          mkdir -p fonts
          if curl -fsSL -o /tmp/pretendard.zip "https://github.com/orioncactus/pretendard/releases/download/v1.3.9/Pretendard-1.3.9.zip" && \
             unzip -o -j /tmp/pretendard.zip \
               "public/static/alternative/Pretendard-SemiBold.ttf" \
               "public/static/alternative/Pretendard-Medium.ttf" \
               "public/static/alternative/Pretendard-Regular.ttf" \
               -d fonts; then
            rm -f /tmp/pretendard.zip
            ls -la fonts
          else
            rm -f /tmp/pretendard.zip
            sudo apt-get update
            sudo apt-get install -y fonts-nanum
          fi

      - name: Python 3.12 설정 및 패키지 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 카드뉴스 생성 및 인스타그램 자동 게시
        env:
          PYTHONIOENCODING: utf-8
          DURUNUBI_API_KEY: ${{ secrets.DURUNUBI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_VERSION: v24.0
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_MEDIA_BRANCH: media-assets
        run: |
          set -o pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("published_history.json")
          before_count = 0
          if p.is_file():
              data = json.loads(p.read_text(encoding="utf-8"))
              published = data.get("published", [])
              if isinstance(published, list):
                  before_count = len(published)
          Path("/tmp/traillog_before.json").write_text(json.dumps({"count": before_count}), encoding="utf-8")
          PY
          ARGS=(--brd "${{ inputs.brd || '걷기' }}" --style "${{ inputs.style || 'auto' }}" --skip-published --round-robin --max-daily 5 --count 1)
          if [ -n "${{ inputs.keyword }}" ]; then
            ARGS+=(--keyword "${{ inputs.keyword }}")
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run-publish)
          else
            ARGS+=(--publish)
          fi
          python main.py "${ARGS[@]}" | tee /tmp/traillog_run.log

      - name: 게시 이력(published_history.json) 자동 커밋
        if: ${{ inputs.dry_run != true }}
        run: |
          if ! git diff --quiet published_history.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add published_history.json
            git commit -m "chore: update published_history.json [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Slack 실행 결과 보고
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          TARGET_CHANNEL: ${{ inputs.slack_channel_id || secrets.SLACK_REPORT_CHANNEL_ID }}
          JOB_STATUS: ${{ job.status }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_BRD: ${{ inputs.brd || '걷기' }}
          INPUT_STYLE: ${{ inputs.style || 'auto' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          def _esc(val: object) -> str:
              return str(val or "").replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")

          token = os.environ.get("SLACK_BOT_TOKEN", "").strip()
          channel = os.environ.get("TARGET_CHANNEL", "").strip()
          if not token or not channel:
              print("Slack 토큰 또는 보고 채널이 없어 알림을 건너뜁니다.")
              raise SystemExit(0)

          job_status = os.environ.get("JOB_STATUS", "unknown")
          ok = job_status == "success"
          is_dry = os.environ.get("INPUT_DRY_RUN") == "true"

          before_path = Path("/tmp/traillog_before.json")
          before_count = 0
          if before_path.is_file():
              try:
                  before_count = int(json.loads(before_path.read_text(encoding="utf-8")).get("count", 0))
              except Exception:
                  before_count = 0

          hist_path = Path("published_history.json")
          published = []
          if hist_path.is_file():
              try:
                  raw = json.loads(hist_path.read_text(encoding="utf-8"))
                  if isinstance(raw.get("published"), list):
                      published = raw["published"]
              except Exception:
                  published = []

          new_items = [item for item in published[before_count:] if isinstance(item, dict)]

          if not ok:
              badge = f":x: *TrailLog 인스타그램 자동 게시 실패 ({job_status})*"
          elif is_dry:
              badge = ":test_tube: *TrailLog 드라이런(사전 검증) 완료*"
          elif new_items:
              badge = f":camera_with_flash: *TrailLog 인스타그램 자동 게시 완료 ({len(new_items)}건)*"
          else:
              badge = ":information_source: *TrailLog 실행 완료 (신규 게시 없음)*"

          trigger_desc = "클라우드/Slack 자동 실행"
          brd = os.environ.get("INPUT_BRD", "걷기")
          style_in = os.environ.get("INPUT_STYLE", "auto")

          msg_lines = [
              badge,
              f"• 실행 방식: {trigger_desc} | 구분: `{brd}` | 스타일: `{style_in}`",
          ]

          if new_items:
              msg_lines.append(f"• *이번 실행 게시물 ({len(new_items)}건)*:")
              for idx, item in enumerate(new_items, start=1):
                  cname = _esc(item.get("course_name") or item.get("crs_idx") or "코스")
                  st = _esc(item.get("style") or "-")
                  slides = item.get("slide_count", "-")
                  link = str(item.get("permalink") or "").strip()
                  link_part = f" — <{link}|인스타그램 게시물 보기>" if link else ""
                  msg_lines.append(f"  {idx}. *{cname}* (스타일: `{st}`, 슬라이드 `{slides}장`){link_part}")
              msg_lines.append(f"• 누적 게시: 총 {len(published)}건")

          if (not ok) or is_dry or (not new_items):
              log_path = Path("/tmp/traillog_run.log")
              if log_path.is_file():
                  lines = log_path.read_text(encoding="utf-8", errors="replace").splitlines()
                  tail_text = "\n".join(lines[-18:]).strip()
                  if tail_text:
                      msg_lines.append(f"• *실행 요약*:\n```\n{tail_text[:2500]}\n```")

          msg_lines.append(f"<{os.environ.get('RUN_URL', '')}|GitHub Actions 실행 로그 보기>")

          data = json.dumps({"channel": channel, "text": "\n".join(msg_lines)}).encode("utf-8")
          req = urllib.request.Request(
              "https://slack.com/api/chat.postMessage",
              data=data,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json; charset=utf-8",
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=20) as resp:
              print("Slack 응답:", resp.read().decode("utf-8", errors="replace"))
          PY
